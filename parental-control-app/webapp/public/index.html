<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Balise — appli parent</title>
<style>
  :root {
    --paper:#F2F5F3; --surface:#FBFCFB; --surface-2:#E9EFEC; --ink:#14201C; --ink-soft:#47554F;
    --line:#D5DED9; --pine:#1B5A4E; --apricot:#D9713E; --good:#2E7D5B; --bad:#B0503C; --warn:#B5852A;
    --disp: Georgia,"Times New Roman",serif;
    --body: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root{--paper:#0F1613;--surface:#16211D;--surface-2:#1D2A25;--ink:#E7EDE9;--ink-soft:#A2B1AB;--line:#2A3833;--pine:#4FB39D;--apricot:#E8946A;--good:#5CB98C;--bad:#E08066;--warn:#D6AC55;}}
  *{box-sizing:border-box;} html,body{height:100%;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;max-width:520px;margin:0 auto;}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--surface);}
  header .dot{width:30px;height:30px;border-radius:9px;background:var(--pine);color:#fff;display:grid;place-items:center;}
  header .name{font-family:var(--disp);font-weight:600;} header .sub{font-size:.72rem;color:var(--ink-soft);}
  header select{margin-left:auto;font-family:var(--body);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--paper);color:var(--ink);}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .b{max-width:84%;padding:10px 13px;border-radius:16px;font-size:.92rem;line-height:1.45;}
  .b.me{align-self:flex-end;background:var(--pine);color:#fff;border-bottom-right-radius:5px;}
  .b.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px;}
  .card{align-self:flex-start;max-width:92%;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pine);border-radius:12px;padding:10px 12px;font-size:.85rem;}
  .card .k{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--pine);font-weight:700;margin-bottom:4px;}
  .badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;margin:2px 4px 0 0;}
  .badge.block{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);}
  .badge.ask{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);}
  .badge.allow{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);}
  .via{font-size:.66rem;color:var(--ink-soft);align-self:flex-start;margin-top:-4px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0;}
  .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:.78rem;cursor:pointer;color:var(--ink);font-family:var(--body);}
  .chip:hover{border-color:var(--pine);color:var(--pine);}
  form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface);}
  input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 15px;font-size:.95rem;background:var(--paper);color:var(--ink);font-family:var(--body);}
  button.send{border:0;background:var(--pine);color:#fff;border-radius:999px;padding:0 18px;font-weight:700;cursor:pointer;font-family:var(--body);}
  button.sim{border:0;background:color-mix(in srgb,var(--apricot) 18%,transparent);color:var(--apricot);border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:.8rem;font-family:var(--body);}
</style>
</head>
<body>
  <header>
    <div class="dot">🧭</div>
    <div><div class="name">Balise</div><div class="sub" id="sub">Centre de contrôle</div></div>
    <select id="age" onchange="init()">
      <option value="8-10">Enfant 8–10 ans</option>
      <option value="11-12">Enfant 11–12 ans</option>
      <option value="13-15" selected>Enfant 13–15 ans</option>
      <option value="16-17">Ado 16–17 ans</option>
    </select>
  </header>

  <div id="chat"></div>

  <div class="chips" id="chips"></div>
  <div style="padding:8px 14px 0;"><button class="sim" onclick="doSim()">🔍 Tester ce que verrait l'enfant maintenant</button></div>

  <form onsubmit="send(event)">
    <input id="input" placeholder="Dis une règle… ex : pas de TikTok en semaine après 21h" autocomplete="off" />
    <button class="send" type="submit">Envoyer</button>
  </form>

<script>
let ruleSet = null;
const chat = document.getElementById("chat");

const SUGGESTIONS = [
  "Pas de TikTok en semaine après 21h",
  "Jamais de sites pour adultes",
  "YouTube : je veux valider avant",
  "Bloque les réseaux sociaux le soir",
];

function add(cls, html){ const d=document.createElement("div"); d.className=cls; d.innerHTML=html; chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d; }

function renderChips(){
  const box=document.getElementById("chips"); box.innerHTML="";
  SUGGESTIONS.forEach(s=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=s; b.onclick=()=>{document.getElementById("input").value=s;}; box.appendChild(b); });
}

async function init(){
  const age=document.getElementById("age").value;
  const r=await fetch("/api/init?age="+age); ruleSet=(await r.json()).ruleSet;
  document.getElementById("sub").textContent="Centre de contrôle · "+ruleSet.rules.length+" règles de base";
  chat.innerHTML="";
  add("b ai","Bonjour 👋 Dis-moi simplement ce que tu veux pour ton enfant (horaires, ce qui est permis ou non). Je m'occupe des réglages. J'ai déjà mis des protections de base adaptées à l'âge.");
}

const BADGE={block:"❌ Bloqué",ask:"🙋 À valider",allow:"✅ Autorisé"};

async function send(e){
  e.preventDefault();
  const inp=document.getElementById("input"); const intent=inp.value.trim(); if(!intent) return;
  inp.value=""; add("b me", intent);
  const typing=add("b ai","…");
  try{
    const r=await fetch("/api/plan",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({intent,ruleSet})});
    const data=await r.json();
    ruleSet=data.result.ruleSet;
    typing.innerHTML=data.plan.summary;
    add("via","via "+data.via);
    if(data.result.applied.length){
      const c=add("card","<div class='k'>Ce qui change</div>"+data.result.applied.map(a=>"• "+a).join("<br>"));
    }
    data.result.warnings.forEach(w=>add("b ai","⚠️ "+w));
    document.getElementById("sub").textContent="Centre de contrôle · "+ruleSet.rules.length+" règles actives";
  }catch(err){ typing.innerHTML="Oups, erreur : "+err; }
}

async function doSim(){
  const r=await fetch("/api/simulate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ruleSet})});
  const {simulation}=await r.json();
  const rows=simulation.results.map(x=>{
    const icon=x.verdict.decision==="block"?"❌":x.verdict.decision==="ask"?"🙋":"✅";
    return icon+" "+(x.target.label)+" — "+x.verdict.reason;
  }).join("<br>");
  add("card","<div class='k'>🔍 Sur le téléphone de l'enfant, maintenant</div>"+rows+
    "<br><br>"+simulation.counts.allow+" autorisés · "+simulation.counts.block+" bloqués · "+simulation.counts.ask+" à valider");
}

renderChips(); init();
</script>
</body>
</html>
